    <style>
        /* Splash Screen Styles */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: #0E0F12;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            #splash {
                transition: none;
            }
        }

        /* Diagonal */
        .splash-diagonal {
            width: 8px;
            height: 120px;
            background-color: #8F1D2C;
            transform: rotate(-45deg);
            border-radius: 0;
        }

        /* Gold Dot */
        .splash-dot {
            position: absolute;
            top: 48px;
            right: 48px;
            width: 8px;
            height: 8px;
            background-color: #FFC72C;
            border-radius: 0;
        }
    </style>
</head>
