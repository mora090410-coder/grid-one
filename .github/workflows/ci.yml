name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Focused free lifecycle and historical settlement SQL regression
        run: |
          docker pull postgres:17
          npx vitest run --project integration tests/pregameSharing.integration.test.ts tests/organizationPurchase.integration.test.ts

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        env:
          # Vite bakes these public, non-secret fixtures into the built UI.
          # They must match the organizer session fixture in playwright.config.ts.
          VITE_SUPABASE_URL: https://gridone-test.supabase.invalid
          VITE_SUPABASE_ANON_KEY: playwright-test-anon-key
        run: npm run build

      - name: Design lint
        run: npm run design:lint

      # Integration tests start disposable Postgres containers and apply the
      # migrations in this repo. They do not use production credentials and
      # they do not talk to the production Supabase project.
      - name: Pull the Postgres image used by integration tests
        run: docker pull postgres:17

      - name: Integration tests
        run: npm run test:integration

      - name: Free organizer and public board browser regression
        if: github.event_name == 'pull_request'
        env:
          # Exercise the built route chunks, not Vite's cold dev transform server.
          PLAYWRIGHT_BUILT_UI: '1'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --trace retain-on-failure playwright-tests/homepage.spec.ts playwright-tests/pregame-selling.spec.ts playwright-tests/organizer.spec.ts
