<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridOne Organizer B2 — Task Header Context</title>
<link rel="stylesheet" href="../theme.css">
<style>
body{background:var(--neutral);color:var(--ink)}.task-header{position:sticky;top:0;z-index:25;background:var(--neutral);border-bottom:1px solid rgba(14,15,18,.35);box-shadow:var(--shadow)}.task-inner{max-width:1180px;margin:auto;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.mini{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.save{font-family:"Chivo Mono",monospace;font-size:14px}.save[data-state=error]{color:var(--primary);font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--primary);color:var(--neutral);border-color:var(--primary);font-weight:900;text-transform:uppercase;letter-spacing:.05em}.primary.commit{background:var(--accent);color:var(--ink);border-color:var(--accent)}.secondary{background:var(--quiet);color:var(--ink)}.fixture-bar{display:flex;gap:6px;overflow:auto;padding:8px 12px;border-top:1px solid rgba(14,15,18,.25)}.fixture-bar button[aria-pressed=true]{background:var(--accent);color:var(--ink);border-color:var(--accent)}.workspace{max-width:1180px;margin:auto;padding:14px 12px 54px}.disclosure{margin-bottom:12px;border:1px solid rgba(14,15,18,.35);border-radius:var(--r-surface);background:var(--quiet);padding:8px}summary{min-height:44px;display:flex;align-items:center;font-weight:900;cursor:pointer}.phase-list{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:8px}.phase{width:100%;text-align:left;background:var(--neutral);color:var(--ink);border-color:rgba(14,15,18,.45)}.phase[aria-current=step]{background:var(--dark);color:var(--neutral);border-color:var(--dark)}.artifact{background:var(--neutral);border-top:8px solid var(--primary);padding-top:14px}.artifact-copy{max-width:860px;margin-bottom:12px}.lead{font-size:19px;max-width:74ch}.tool-row,.axes{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.board-wrap{overflow:auto;border:1px solid rgba(14,15,18,.5);margin-top:14px}.board-table{border-collapse:collapse;min-width:920px;width:100%;background:var(--neutral)}caption{text-align:left;padding:8px;font-weight:800}th,td{border:1px solid rgba(14,15,18,.45);padding:0}.axis,.corner{height:44px;min-width:64px;background:var(--dark);color:var(--neutral);text-align:center}.cell button{width:100%;min-width:78px;height:58px;border:0;border-radius:0;padding:4px;font-size:12px;background:var(--quiet);color:var(--ink)}.cell button[aria-pressed=true]{outline:3px solid var(--primary);background:var(--neutral);font-weight:900}.checklist{padding-left:20px}.ok::marker{content:'✓ '}.advisory::marker{content:'◇ '}.blocker::marker{content:'! '}.viewer-preview,.review{border:1px solid rgba(14,15,18,.45);padding:14px;border-radius:var(--r-surface);background:var(--dark);color:var(--neutral);margin-top:14px}dt{font-weight:900}dd{margin:0 0 10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:760px){.task-inner{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}.workspace{padding:10px}.phase-list{display:flex;overflow:auto;padding-bottom:4px}.phase{min-width:168px}.board-table{min-width:760px}}@media(prefers-reduced-motion:reduce){*,html{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to full-width artifact</a>
<header class="task-header"><div class="task-inner"><div><div class="mini"><strong>GridOne organizer · B2</strong><span class="demo">Synthetic demonstration data only</span><span id="save" class="save" data-state="clean">Saved 10:42 AM · rev 18</span></div><p id="eyebrow" class="label"></p><h1 id="phaseTitle" tabindex="-1"></h1></div><div class="actions"><button id="primary" class="primary" type="button"></button><button id="secondary" class="secondary" type="button"></button></div></div><div class="fixture-bar" aria-label="Fixture toggles"><button type="button" data-fixture="Fill">Fill</button><button type="button" data-fixture="Reconcile">Reconcile</button><button type="button" data-fixture="Draw">Draw</button><button type="button" data-fixture="Preview">Preview</button><button type="button" data-fixture="Go Live">Go Live</button><button type="button" data-fixture="Conflict">Conflict</button></div><div class="horizon"></div></header>
<main id="main" class="workspace"><details class="disclosure"><summary>Show progress and prior phases</summary><div id="phaseRail" class="phase-list" aria-label="Contextual phase progress"></div><p>Progress and prior phases stay behind disclosure so the current task and full-width artifact own the surface.</p></details><section class="artifact" aria-labelledby="phaseTitle"><div id="body" class="artifact-copy stack"></div><div id="board" class="board-wrap" aria-label="Assignment board viewport"></div></section><div id="live" class="sr-only" aria-live="polite"></div></main>
<script>
const phases=['Fill','Reconcile','Draw','Preview','Go Live'];
const names=['OPEN','M. Torres','C. Nguyen','R. Patel','OPEN','J. Brooks','A. Williams','OPEN','K. Stone','D. Rivera','S. Long','OPEN','N. Ellis','P. Carter','OPEN'];
const topDigits=[7,2,0,9,4,6,1,8,3,5], sideDigits=[4,9,6,0,2,8,5,1,7,3];
const state={phase:'Fill',conflict:false,bulk:false,advisory:true,duplicates:true,drawPreview:false,drawCommitted:false,selected:new Set(['A1','A2','B1','D4']),assigned:37,open:63,top:[1,6,8,0,3,9,5,2,7,4],side:[9,0,7,5,2,1,8,6,4,3]};
const byId=(id)=>document.getElementById(id);function make(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function announce(text){byId('live').textContent=text}function save(text,error){const s=byId('save');s.textContent=text;s.dataset.state=error?'error':'clean';announce(text)}
function renderRail(){const host=byId('phaseRail');host.textContent='';phases.forEach((p,i)=>{const b=make('button','phase');b.type='button';b.textContent=p+' — '+(i<phases.indexOf(state.phase)?'Complete':i===phases.indexOf(state.phase)?'Current':'Upcoming');b.setAttribute('aria-current',state.phase===p?'step':'false');b.disabled=state.conflict;b.addEventListener('click',()=>{if(state.conflict){announce('Resolve the save conflict before changing phases');return}state.phase=p;render();byId('phaseTitle').focus()});host.appendChild(b)})}
function renderBoard(){const host=byId('board');host.textContent='';if(state.phase!=='Fill'){host.hidden=true;return}host.hidden=false;const table=make('table','board-table');table.appendChild(make('caption',null,'Synthetic demonstration assignment board. Full-width artifact with native horizontal board scrolling on phone.'));const thead=make('thead');const hr=make('tr');hr.appendChild(make('th','corner','Side / Top'));topDigits.forEach(d=>hr.appendChild(make('th','axis data',String(d))));thead.appendChild(hr);table.appendChild(thead);const tb=make('tbody');for(let r=0;r<10;r++){const tr=make('tr');tr.appendChild(make('th','axis data',String(sideDigits[r])));for(let c=0;c<10;c++){const coord=String.fromCharCode(65+r)+(c+1);const td=make('td','cell');const btn=make('button',null,names[(r*3+c)%names.length]);btn.type='button';btn.setAttribute('aria-pressed',state.selected.has(coord)?'true':'false');btn.setAttribute('aria-label',coord+' synthetic square, '+btn.textContent+', top digit '+topDigits[c]+', side digit '+sideDigits[r]);btn.addEventListener('click',()=>{if(state.selected.has(coord)){state.selected.delete(coord)}else{state.selected.add(coord)}render();announce(state.selected.size+' squares selected for bulk assignment')});td.appendChild(btn);tr.appendChild(td)}tb.appendChild(tr)}table.appendChild(tb);host.appendChild(table)}
function renderConflict(body){body.appendChild(make('p','lead','This board changed in another session. Autosave is stopped. Phase progression, draw, preview, and Go Live are blocked.'));const ul=make('ul','checklist');['Reload latest board','Review local changes before reload','Never silently overwrite the newer server revision'].forEach(x=>ul.appendChild(make('li','blocker',x)));body.appendChild(ul);byId('primary').textContent='Review local changes';byId('secondary').textContent='Reload latest board'}
function renderPhase(){const body=byId('body');body.textContent='';byId('eyebrow').textContent='Synthetic organizer demo · Crown Point Eagles fundraiser board';byId('phaseTitle').textContent=state.phase;byId('primary').className='primary';byId('primary').disabled=false;if(state.conflict){renderConflict(body);renderBoard();return}if(state.phase==='Fill'){body.appendChild(make('p','lead','Assign sold squares from the sticky current-task header. Payment marks are private advisory metadata and never hard-block movement.'));const tools=make('div','tool-row');const bulk=make('button','secondary',state.bulk?'Bulk assignment on':'Start bulk assignment');bulk.type='button';bulk.setAttribute('aria-pressed',state.bulk?'true':'false');bulk.addEventListener('click',()=>{state.bulk=!state.bulk;render();announce(state.bulk?'Bulk assignment mode enabled':'Bulk assignment mode disabled')});const apply=make('button','secondary','Apply label to '+state.selected.size+' selected');apply.type='button';apply.addEventListener('click',()=>{state.assigned+=state.selected.size;state.open=Math.max(0,100-state.assigned);save('Saving assignment changes…',false);setTimeout(()=>save('Saved 10:43 AM · rev 19',false),180);render()});tools.appendChild(bulk);tools.appendChild(apply);body.appendChild(tools);byId('primary').textContent='Review board';byId('secondary').textContent='Trigger conflict fixture'}
if(state.phase==='Reconcile'){body.appendChild(make('p','lead','Required visible checkpoint. Advisory payment items are visible but do not block the draw.'));const ul=make('ul','checklist');['Valid 100-cell board shape','At least one assigned square','Scheduled game and kickoff present','Open squares explicitly acknowledged','Latest writes saved'].forEach(x=>ul.appendChild(make('li','ok',x)));if(state.duplicates)ul.appendChild(make('li','blocker','4 duplicate display labels must be resolved for Find My Squares'));if(state.advisory){['12 unpaid/unknown payment marks — advisory, not hard-blocking','5 missing seller labels — advisory, not hard-blocking','63 OPEN squares acknowledged'].forEach(x=>ul.appendChild(make('li','advisory',x)))}body.appendChild(ul);const resolveDuplicates=make('button','secondary',state.duplicates?'Resolve duplicate labels fixture':'Duplicate labels resolved');resolveDuplicates.disabled=!state.duplicates;resolveDuplicates.addEventListener('click',()=>{state.duplicates=false;save('Duplicate display labels resolved · rev 20',false);render()});body.appendChild(resolveDuplicates);byId('primary').textContent=state.duplicates?'Resolve duplicate labels':state.advisory?'Continue anyway':'Continue to draw';byId('primary').disabled=state.duplicates;byId('secondary').textContent='Toggle advisory items'}
if(state.phase==='Draw'){body.appendChild(make('p','lead','Preview synthetic axis permutations, regenerate if needed, then commit the draft draw. Publication lock waits until Go Live.'));const axes=make('div','axes');axes.appendChild(make('div','axis-line data','Top draft: '+(state.drawPreview?state.top.join(' '):'not generated')));axes.appendChild(make('div','axis-line data','Side draft: '+(state.drawPreview?state.side.join(' '):'not generated')));body.appendChild(axes);byId('primary').textContent=state.drawPreview?'Commit draw':'Preview draw';byId('secondary').textContent=state.drawPreview?'Regenerate preview':'Back to Reconcile'}
if(state.phase==='Preview'){body.appendChild(make('p','lead','Private preview — sharing is off. Exact public viewer surface represented with synthetic labels and OPEN squares.'));const p=make('section','viewer-preview');p.appendChild(make('h2',null,'Viewer preview: Crown Point Eagles Squares'));p.appendChild(make('p','data','Pregame · score authority pending · updates about every minute after kickoff'));p.appendChild(make('p',null,'Public labels, axis digits, OPEN squares, rules, and payout descriptions are visible. Payment metadata remains private.'));body.appendChild(p);byId('primary').textContent='Review and publish';byId('secondary').textContent='Open-square acknowledgment fixture'}
if(state.phase==='Go Live'){body.appendChild(make('p','lead','Go Live review. This creates the public viewer record; this prototype calls no APIs and writes no data.'));const dl=make('dl','review');[['Board','Crown Point Eagles Squares'],['Matchup','IND at CHI · Sun 6:20 PM'],['Assigned/open','37 assigned / 63 OPEN'],['Axes','Top '+state.top.join(' ')+' · Side '+state.side.join(' ')],['Public','Display labels, axes, rules, OPEN squares'],['Private','Payment status, seller attribution, contact data']].forEach(pair=>{dl.appendChild(make('dt',null,pair[0]));dl.appendChild(make('dd',null,pair[1]))});body.appendChild(dl);byId('primary').textContent='Publish viewer link';byId('secondary').textContent='Return to preview'}renderBoard()}
function primary(){if(state.conflict){announce('Review local changes selected');return}if(state.phase==='Fill')state.phase='Reconcile';else if(state.phase==='Reconcile'){if(state.duplicates){announce('Resolve duplicate display labels before continuing');return}state.phase='Draw'}else if(state.phase==='Draw'){if(!state.drawPreview){state.drawPreview=true;announce('Draw preview generated. Not committed.')}else{state.drawCommitted=true;state.phase='Preview';save('Committed draft draw saved · rev 21',false)}}else if(state.phase==='Preview')state.phase='Go Live';else announce('Go Live review reached. Prototype stops before publication.');render()}function secondary(){if(state.conflict){state.conflict=false;save('Reloaded latest board · rev 21',false);render();return}if(state.phase==='Fill'){state.conflict=true;save('Conflict: this board changed in another session.',true)}else if(state.phase==='Reconcile')state.advisory=!state.advisory;else if(state.phase==='Draw'){if(state.drawPreview){state.top.reverse();state.side.reverse();announce('Synthetic draw preview regenerated')}else{state.phase='Reconcile'}}else if(state.phase==='Go Live')state.phase='Preview';render()}function render(){renderRail();renderPhase();document.querySelectorAll('[data-fixture]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.fixture===state.phase||(b.dataset.fixture==='Conflict'&&state.conflict))?'true':'false'))}document.addEventListener('DOMContentLoaded',()=>{byId('primary').addEventListener('click',primary);byId('secondary').addEventListener('click',secondary);document.querySelectorAll('[data-fixture]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.fixture==='Conflict'){if(!state.conflict){state.conflict=true;save('Conflict: this board changed in another session.',true)}else announce('Use Reload latest board to clear the conflict')}else if(state.conflict){announce('Resolve the save conflict before changing fixture states');return}else{state.phase=b.dataset.fixture}render()}));render()});
</script>
</body>
</html>
